# ゲーム本体 (sts2.dll) が無い環境でできる検査を回す。
# 本物の sts2.dll での型チェックと実機での動作確認は、ゲームのある PC で scripts/check.sh / make check を使う。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  check:
    name: 整形・型チェック (スタブ)・アナライザ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.*') }}
          restore-keys: nuget-
      # ubuntu-latest には shellcheck が最初から入っている
      - run: scripts/check.sh --stubs

  pck:
    name: .pck 書き出し
    runs-on: ubuntu-latest
    env:
      # ゲームが使う MegaDot (Godot 4.5.1 の Mega Crit 版)。https://megadot.megacrit.com/api/ で一覧が見られる
      MEGADOT_VERSION: 4.5.1-m.14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        id: megadot-cache
        with:
          path: ~/megadot
          key: megadot-${{ env.MEGADOT_VERSION }}-linux
      - name: MegaDot を取得
        if: steps.megadot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/megadot && cd ~/megadot
          curl -fsSL -o megadot.zip "https://megadot.megacrit.com/${MEGADOT_VERSION}/megadot-${MEGADOT_VERSION}-linux-x86_64-editor-csharp.zip"
          unzip -q megadot.zip && rm megadot.zip
      - name: アセットを持つ Mod の .pck を書き出す
        run: |
          export GODOT_PATH="$(ls ~/megadot/MegaDot_*_mono_linux.x86_64)"
          for dir in mods/*/; do
            mod="$(basename "$dir")"
            [ -d "mods/$mod/$mod" ] || continue
            scripts/export-pck.sh "$mod" "out/$mod"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pck
          path: out/
          if-no-files-found: ignore
